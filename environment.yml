name: insite
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - biopython=1.78
  - numpy=1.26
  - openbabel=3.1.1
  - pandas=2.1
  - pip
  - pytorch=2.5.1
  - pytorch-cuda=11.8
  - rdkit=2023.09
  - scikit-learn=1.6
  - scipy=1.13
  - tqdm=4.67
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.5.0+cu118.html
      - --only-binary=torch-cluster,torch-scatter
      - torch-cluster==1.6.3
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2
      - wandb==0.25.0
